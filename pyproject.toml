[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vehicles-dev"
version = "0.1.1"
description = "Official Python SDK for the Vehicles.dev API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vehicles.dev" }]
keywords = ["vehicles", "vin", "automotive", "sdk", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Documentation = "https://github.com/vehicles-dev/python-sdk#readme"
Issues = "https://github.com/vehicles-dev/python-sdk/issues"
Repository = "https://github.com/vehicles-dev/python-sdk"

[dependency-groups]
dev = [
  "build>=1.2.2",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "twine>=6.1",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vehicles_dev"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

